// ── AUR ───────────────────────────────────────────────────────────────────────

tasks.register("build_aur") {
    description = "Generate dist/AUR/PKGBUILD and .SRCINFO"
    group       = "packaging"
    dependsOn   "build_tar"

    doLast {
        def aurOut  = file("${outDir}/AUR")
        def tarFile = file("${outDir}/MediaInfoGui${version}.tar")
        aurOut.mkdirs()

        def sha256 = computeSHA256(tarFile)
        println "  AUR source tarball: ${tarFile.name}  sha256=${sha256}"

        def archCfg = distros['arch']
        copy {
            from "build/AUR-template/PKGBUILD"
            into aurOut
            filter(ReplaceTokens, tokens: tok([
                xxx      : version,
                xpkgrelx : pkgrelease,
                sha256sum: sha256,
                xlibsx   : archPkgFmt(archCfg.libs),
                xoptlibsx: archPkgFmt(archCfg.optLibs),
            ]))
        }

        file("${aurOut}/.SRCINFO").text =
            makeSrcInfo(version, pkgrelease, sha256, archCfg.libs, archCfg.optLibs)
        println "  .SRCINFO generated"
    }
}

// ── DEB (one task per ubuntu distro) ─────────────────────────────────────────

distros.findAll { _name, cfg -> cfg.type == "ubuntu" }.each { _name, cfg ->

    tasks.register("build_${_name}") {
        description = "Generate dist/DEB tarball for Ubuntu ${cfg.codename}"
        group       = "packaging"

        doLast {
            def buildName = "mediainfogui_${version}+${pkgrelease}~${cfg.codename}"
            def ubuStage  = stageDir(buildName)
            def debOut    = file("${outDir}/DEB")
            ubuStage.mkdirs()
            debOut.mkdirs()

            stageSources(file("${ubuStage}/src"))

            // a single, toolkit-neutral entry - the app decides at runtime
            // which UI to use (see detectToolkit in MediaInfoGui.py)
            copy {
                from "build/MediaInfoGui.desktop"
                into "${ubuStage}/addons"
            }

            def timestamp = ZonedDateTime.now(ZoneOffset.UTC)
                .format(DateTimeFormatter.ofPattern("EEE, d MMM yyyy HH:mm:ss", Locale.ENGLISH))

            // copyright is copied unfiltered — @ in email addresses would be
            // misinterpreted as ReplaceTokens delimiters
            copy {
                from "build/DEB-template/debian"
                into "${ubuStage}/debian"
                exclude "copyright"
                filter(ReplaceTokens, tokens: tok([
                    ubu       : cfg.codename,
                    xxx       : version,
                    xpkgrelx  : pkgrelease,
                    xtsx      : timestamp,
                    xlibsx    : cfg.libs,
                    xsuggestsx: cfg.suggests,
                ]))
            }
            copy {
                from "build/DEB-template/debian/copyright"
                into "${ubuStage}/debian"
            }

            def tarFile = file("${debOut}/${buildName}.tar")
            makeTar(tarFile, buildName, ubuStage)
            println "  → ${tarFile.name}"

            delete ubuStage
        }
    }
}

// ── aggregate / clean ─────────────────────────────────────────────────────────

tasks.register("clean") {
    description = "Delete the dist/ output directory"
    group       = "build"
    doLast { delete outDir }
}

// "clean" wipes dist/ - so whenever it is part of the build, it runs first
tasks.matching { t -> t.name.startsWith("build_") || t.name == "update_readme" }
     .configureEach { mustRunAfter "clean" }

tasks.register("build_all") {
    description = "Build install tarball, AUR package, DEB x${distros.count { it.value.type == 'ubuntu' }}"
    group       = "packaging"
    dependsOn "clean"
    dependsOn "update_readme", "build_tar", "build_aur"  //, "build_pypi"
    dependsOn tasks.matching { t -> t.name.startsWith("build_ubu") }
    doLast { delete file("${outDir}/stage") }
}

defaultTasks "build_all"
