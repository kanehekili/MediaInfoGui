import org.apache.tools.ant.filters.ReplaceTokens
import java.security.MessageDigest
import java.time.ZoneOffset
import java.time.ZonedDateTime
import java.time.format.DateTimeFormatter

def version    = gradle.ext.version
def pkgrelease = gradle.ext.pkgrelease
def distros    = gradle.ext.distros
def outDir     = file("dist")

def tok(Map m) { m.collectEntries { k, v -> [k.toString(), v.toString()] } }

def stageDir = { String sub -> file("${outDir}/stage/${sub}") }

// MediaInfoGui.py carries the @xxxx@ version token, the rest is copied as-is
def stageSources = { File dst ->
    copy {
        from("src") { include "MediaInfoGui.py" }
        into(dst)
        filter(ReplaceTokens, tokens: tok([xxxx: version]))
    }
    copy {
        from("src") { include "MediaInfoWidgets*.py", "*.png" }
        into(dst)
    }
}

// Create an uncompressed tar; arcName becomes the single root directory inside.
// ant.tar ignores on-disk permissions and stamps 644 - install scripts and
// debian/rules must be executable, so they get their own fileset.
def makeTar = { File tarFile, String arcName, File sourceDir ->
    def execFiles = "${arcName}/*.sh,${arcName}/debian/rules"
    ant.tar(destfile: tarFile) {
        tarfileset(dir: sourceDir.parent, includes: "${arcName}/**", excludes: execFiles)
        tarfileset(dir: sourceDir.parent, includes: execFiles, filemode: "755")
    }
}

def computeSHA256(File f) {
    def md = MessageDigest.getInstance("SHA-256")
    f.eachByte(65536) { bytes, len -> md.update(bytes, 0, len) }
    md.digest().encodeHex().toString()
}

// "pkg-a, pkg-b: desc" → "'pkg-a' 'pkg-b: desc'"  (PKGBUILD array format)
def archPkgFmt(String s) { s.split(',').collect { "'${it.trim()}'" }.join(' ') }

def makeSrcInfo(String pkgver, String pkgrel, String sha256, String deps, String optDeps) {
    def depLines    = deps.split(',').collect    { "\tdepends = ${it.trim()}" }.join("\n")
    def optDepLines = optDeps.split(',').collect { "\toptdepends = ${it.trim()}" }.join("\n")
"""\
pkgbase = mediainfogui
\tpkgdesc = GUI for MediaInfo data — Qt6, GTK3 and GTK4
\tpkgver = ${pkgver}
\tpkgrel = ${pkgrel}
\turl = https://github.com/kanehekili/MediaInfoGui
\tarch = x86_64
\tarch = aarch64
\tlicense = GPL-2.0-or-later
${depLines}
${optDepLines}
\tsource = https://github.com/kanehekili/MediaInfoGui/releases/download/${pkgver}/MediaInfoGui${pkgver}.tar
\tsha256sums = ${sha256}

pkgname = mediainfogui
"""
}

// ── Install tarball (replaces build/build.xml "deploy" target) ────────────────

tasks.register("build_tar") {
    description = "Stage and tar dist/MediaInfoGui${version}.tar for install.sh use"
    group       = "packaging"

    doLast {
        def stage = stageDir("MediaInfoGui")
        stage.mkdirs()

        // Desktop files (one per toolkit) and install scripts
        copy {
            from("build") { include "*.desktop", "*install*.sh" }
            into(stage)
        }

        stageSources(stage)

        def tarFile = file("${outDir}/MediaInfoGui${version}.tar")
        makeTar(tarFile, "MediaInfoGui", stage)

        delete file("${outDir}/stage")
        println "  Install tarball: ${tarFile}"
    }
}

// ── README version sync ───────────────────────────────────────────────────────

tasks.register("update_readme") {
    description = "Rewrite version references in README.md to match settings.gradle"
    group       = "packaging"
    doLast {
        def readme = file("README.md")
        def text   = readme.text
        text = text.replaceAll(/Version \d+\.\d+\.\d+/, "Version ${version}")
        text = text.replaceAll(
            /https:\/\/github\.com\/kanehekili\/MediaInfoGui\/releases\/download\/[\d.]+\/MediaInfoGui[\d.]+\.tar/,
            "https://github.com/kanehekili/MediaInfoGui/releases/download/${version}/MediaInfoGui${version}.tar"
        )
        readme.text = text
        println "  README.md synced to version ${version}"
    }
}

