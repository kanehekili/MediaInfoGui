rootProject.name = "mediainfogui"

// ── Release config ────────────────────────────────────────────────────────────
// Edit version / pkgrelease here, then run:  gradle build_all
gradle.ext.version    = "1.3.2"
gradle.ext.pkgrelease = "1"

// ── Target distros ────────────────────────────────────────────────────────────
// Arch ships all three toolkits and lets the user pick via optdepends.
// A DEB ships one desktop entry; the app picks the toolkit at runtime, so the
// GTK bindings are an alternative dependency: an already present GTK3 (Mint,
// XFCE) satisfies it, an empty system pulls the first one listed (GTK4).
gradle.ext.distros = [

    arch: [
        type:    "arch",
        libs:    "mediainfo",
        optLibs: "python-pyqt6: Qt6 interface, python-gobject: GTK3/GTK4 interface, ffmpeg: MPEG-TS program info",
    ],

    ubu0: [
        type:     "ubuntu",
        codename: "noble",
        libs:     "python3, python3-gi, gir1.2-gtk-4.0 | gir1.2-gtk-3.0, mediainfo",
        suggests: "python3-pyqt6, ffmpeg",
    ],

    ubu1: [
        type:     "ubuntu",
        codename: "resolute",
        libs:     "python3, python3-gi, gir1.2-gtk-4.0 | gir1.2-gtk-3.0, mediainfo",
        suggests: "python3-pyqt6, ffmpeg",
    ],

    ubu2: [
        type:     "ubuntu",
        codename: "stonking",
        libs:     "python3, python3-gi, gir1.2-gtk-4.0 | gir1.2-gtk-3.0, mediainfo",
        suggests: "python3-pyqt6, ffmpeg",
    ],
]
